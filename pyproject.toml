[project]
name = "depot-vision"
version = "0.1.0"
description = "Real-time stock counting and classification (Flet + YOLOv8 + OpenCV)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
addopts = "-ra"
# src-layout: depot_vision is not installed (no editable install), so pytest
# needs pythonpath to import it directly from source during collection.
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "scripts"]
# app.py is the frozen pre-refactor monolith (tests/architecture/test_monolith_frozen.py
# pins its sha256). It must stay byte-identical until Phase 5b, so it is out of lint
# scope entirely rather than "clean" by accident.
extend-exclude = ["app.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 0
show_missing = true

[tool.importlinter]
root_package = "depot_vision"

# Staged layering (D-F): contracts grow as layers land. Currently only the
# ports -> domain direction is enforced (adapters exist but are not yet
# covered); application and presentation layers and adapter contracts are
# appended in later phases.
[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = ["depot_vision.ports", "depot_vision.domain"]
